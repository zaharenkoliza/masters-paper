<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceLab — Голосовой Low-Code Редактор</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;700&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e2a;
    --border: #252a38;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --success: #00c896;
    --warn: #f59e0b;
    --error: #ef4444;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-mid: #94a3b8;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Unbounded', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    height: 100vh;
    display: grid;
    grid-template-rows: 56px 1fr;
    overflow: hidden;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    z-index: 10;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .lang-toggle {
    display: flex;
    gap: 4px;
    margin-left: 8px;
  }
  .lang-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .lang-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,255,0.07);
  }

  .header-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 5px;
  }
  .status-dot.recording { background: var(--error); animation: pulse 1s infinite; }
  .status-dot.ready { background: var(--success); }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr 280px;
    overflow: hidden;
  }

  /* LEFT PANEL — SCENARIO */
  .panel-left {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-title {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }

  .scenario-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .sc-tab {
    flex: 1;
    padding: 8px 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .sc-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .scenario-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .task-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .task-item.active {
    border-color: var(--accent);
    background: rgba(0,229,255,0.05);
  }
  .task-item.done {
    border-color: var(--success);
    opacity: 0.6;
  }
  .task-item.done::after {
    content: '✓';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--success);
    font-size: 14px;
  }
  .task-num {
    font-size: 9px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .task-text {
    font-size: 11px;
    color: var(--text);
    line-height: 1.5;
  }
  .task-hint {
    font-size: 10px;
    color: var(--accent);
    margin-top: 5px;
    font-style: italic;
  }

  .timer-block {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .timer-display {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .timer-display.warn { color: var(--warn); }
  .timer-label { font-size: 9px; color: var(--text-dim); }

  .btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #33eeff; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-mid);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: none;
    border: 1px solid var(--error);
    color: var(--error);
  }

  /* CENTER — EDITOR */
  .panel-center {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .voice-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mic-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text-mid);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mic-btn.recording {
    border-color: var(--error);
    background: rgba(239,68,68,0.15);
    color: var(--error);
    box-shadow: 0 0 0 4px rgba(239,68,68,0.15);
    animation: pulse 1s infinite;
  }
  .mic-btn:hover:not(.recording) {
    border-color: var(--accent);
    color: var(--accent);
  }

  .transcript-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .transcript-raw {
    font-size: 12px;
    color: var(--text-mid);
    min-height: 16px;
  }
  .transcript-raw span { color: var(--text); }
  .intent-display {
    font-size: 11px;
    color: var(--text-dim);
    min-height: 14px;
  }
  .intent-display .intent-tag {
    display: inline-block;
    background: rgba(124,58,237,0.2);
    border: 1px solid rgba(124,58,237,0.4);
    color: #a78bfa;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10px;
    margin-right: 4px;
  }
  .intent-display .slot-tag {
    display: inline-block;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--accent);
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10px;
    margin-right: 4px;
  }
  .result-tag {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    display: inline-block;
  }
  .result-tag.success { background: rgba(0,200,150,0.15); color: var(--success); border: 1px solid rgba(0,200,150,0.3); }
  .result-tag.fail { background: rgba(239,68,68,0.12); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
  .result-tag.ood { background: rgba(245,158,11,0.12); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }

  .workspace {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    position: relative;
  }
  .workspace-empty {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    pointer-events: none;
  }
  .workspace-empty .big { font-size: 32px; margin-bottom: 8px; }

  /* CANVAS ELEMENTS */
  .canvas-el {
    display: inline-block;
    margin: 6px;
    cursor: pointer;
    transition: outline 0.1s;
    border-radius: 4px;
    font-family: var(--font-mono);
  }
  .canvas-el.selected {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .canvas-el button {
    padding: 8px 18px;
    border-radius: 5px;
    border: none;
    cursor: default;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent2);
    color: white;
    pointer-events: none;
  }
  .canvas-el input {
    padding: 7px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    pointer-events: none;
    min-width: 160px;
  }
  .canvas-el .el-heading {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .canvas-el .el-text {
    font-size: 13px;
    color: var(--text-mid);
  }
  .canvas-el .el-container {
    min-width: 200px;
    min-height: 60px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 11px;
  }

  .canvas-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  /* RIGHT PANEL — LOG */
  .panel-right {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .log-entries {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .log-entry {
    padding: 7px 10px;
    border-radius: 5px;
    margin-bottom: 5px;
    font-size: 10px;
    border-left: 3px solid var(--border);
    background: var(--surface2);
    line-height: 1.6;
  }
  .log-entry.success { border-left-color: var(--success); }
  .log-entry.fail { border-left-color: var(--error); }
  .log-entry.ood { border-left-color: var(--warn); }
  .log-time { color: var(--text-dim); font-size: 9px; }
  .log-cmd { color: var(--text); margin: 2px 0; }
  .log-meta { color: var(--text-dim); font-size: 9px; }

  .log-actions {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
  }

  .stats-row {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stat-item {
    background: var(--surface2);
    border-radius: 5px;
    padding: 6px 8px;
  }
  .stat-val {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--accent);
  }
  .stat-label { font-size: 9px; color: var(--text-dim); margin-top: 1px; }

  /* UNDO BUTTON */
  .editor-toolbar {
    border-top: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    background: var(--surface);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .kbd {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 5px;
    font-size: 10px;
    color: var(--text-dim);
  }

  .scenario-header {
    padding: 10px 12px 6px;
    font-size: 10px;
    color: var(--text-mid);
    line-height: 1.5;
  }

  .finish-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }
  .finish-overlay.show { display: flex; }
  .finish-title {
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .finish-sub { color: var(--text-mid); font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>

<header>
  <div class="logo">VoiceLab</div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-ru" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="header-status">
    <div id="mic-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Готово</span>
    </div>
    <div id="session-info" style="color:var(--text-dim);font-size:11px;">Сессия не начата</div>
  </div>
</header>

<div class="main">

  <!-- LEFT: SCENARIO PANEL -->
  <div class="panel-left">
    <div class="panel-title">Сценарий эксперимента</div>
    <div class="scenario-tabs">
      <button class="sc-tab active" onclick="switchScenario(1)">С1</button>
      <button class="sc-tab" onclick="switchScenario(2)">С2</button>
      <button class="sc-tab" onclick="switchScenario(3)">С3</button>
    </div>
    <div class="scenario-header" id="scenario-desc"></div>
    <div class="scenario-body" id="task-list"></div>
    <div class="timer-block">
      <div>
        <div class="timer-label">Время задачи</div>
        <div class="timer-display" id="task-timer">00:00</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <button class="btn btn-primary" id="start-task-btn" onclick="startCurrentTask()">▶ Старт</button>
        <button class="btn btn-ghost" onclick="markTaskDone()">✓ Готово</button>
      </div>
    </div>
  </div>

  <!-- CENTER: EDITOR -->
  <div class="panel-center">
    <div class="voice-bar">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Нажмите для записи (Space)">🎙</button>
      <div class="transcript-area">
        <div class="transcript-raw" id="transcript-raw">Нажмите 🎙 или <span class="kbd">Space</span> для голосового ввода</div>
        <div class="intent-display" id="intent-display"></div>
      </div>
    </div>
    <div class="workspace" id="workspace">
      <div class="canvas-row" id="canvas-row"></div>
      <div class="workspace-empty" id="ws-empty">
        <div class="big">🎙</div>
        Скажите команду для добавления элемента<br>
        <span style="font-size:10px;color:var(--text-dim);margin-top:4px;display:block">«добавь кнопку» / «add button»</span>
      </div>
    </div>
    <div class="editor-toolbar">
      <button class="btn btn-ghost" onclick="undoAction()">↩ Отмена</button>
      <button class="btn btn-ghost" onclick="clearAll()">🗑 Очистить</button>
      <span style="margin-left:auto;font-size:10px;color:var(--text-dim)" id="selected-info">Нет выбранного элемента</span>
    </div>
  </div>

  <!-- RIGHT: LOG PANEL -->
  <div class="panel-right">
    <div class="panel-title">Лог сессии</div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-label">Команд всего</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-success">0%</div>
        <div class="stat-label">TSR</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-fasr">0%</div>
        <div class="stat-label">FASR</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-ood">0%</div>
        <div class="stat-label">Out-of-domain</div>
      </div>
    </div>
    <div class="log-entries" id="log-entries">
      <div style="color:var(--text-dim);font-size:11px;padding:8px;text-align:center">Лог пуст</div>
    </div>
    <div class="log-actions">
      <button class="btn btn-primary" onclick="exportLog()" style="flex:1">↓ Экспорт JSON</button>
      <button class="btn btn-danger" onclick="clearLog()">✕</button>
    </div>
  </div>
</div>

<div class="finish-overlay" id="finish-overlay">
  <div class="finish-title">Задача завершена!</div>
  <div class="finish-sub" id="finish-stats"></div>
  <button class="btn btn-primary" onclick="closeFinish()">Следующая задача</button>
  <button class="btn btn-ghost" onclick="exportLog()">↓ Экспорт лога</button>
</div>

<script>
// ==================== STATE ====================
let currentLang = 'ru';
let currentScenario = 1;
let currentTaskIdx = 0;
let sessionLog = [];
let undoStack = [];
let elements = [];
let selectedEl = null;
let taskStartTime = null;
let taskTimerInterval = null;
let taskAttempts = 0;
let firstAttemptSuccess = false;
let isRecording = false;
let recognition = null;
let speechStartTime = null;

// ==================== SCENARIOS ====================
const scenarios = {
  ru: {
    1: {
      desc: 'Базовые операции. Выполните каждое задание голосовой командой.',
      tasks: [
        { text: 'Добавьте кнопку на рабочую область', hint: '«добавь кнопку»' },
        { text: 'Измените цвет кнопки на красный', hint: '«сделай красной» или «измени цвет на красный»' },
        { text: 'Измените текст кнопки на «Отправить»', hint: '«измени текст на Отправить»' },
        { text: 'Добавьте заголовок', hint: '«добавь заголовок»' },
        { text: 'Удалите кнопку (выберите её и удалите)', hint: '«выбери кнопку», затем «удали элемент»' },
      ]
    },
    2: {
      desc: 'Составные операции. Каждое задание требует 2–3 команды.',
      tasks: [
        { text: 'Создайте синюю кнопку с текстом «Войти»', hint: '«добавь кнопку» → «измени цвет на синий» → «измени текст на Войти»' },
        { text: 'Создайте форму: добавьте поле ввода и кнопку «Отправить»', hint: '«добавь поле ввода» → «добавь кнопку» → «измени текст на Отправить»' },
        { text: 'Добавьте заголовок, измените его цвет на зелёный', hint: '«добавь заголовок» → «сделай зелёным»' },
        { text: 'Отмените последние два действия', hint: '«отмени» (дважды)' },
      ]
    },
    3: {
      desc: 'Свободное задание. Создайте произвольный интерфейс из 5+ элементов.',
      tasks: [
        { text: 'Создайте любой интерфейс используя только голосовые команды. Минимум 5 элементов.', hint: 'Используйте любые доступные команды' },
      ]
    }
  },
  en: {
    1: {
      desc: 'Basic operations. Complete each task using a voice command.',
      tasks: [
        { text: 'Add a button to the workspace', hint: '"add button"' },
        { text: 'Change the button color to red', hint: '"make it red" or "change color to red"' },
        { text: 'Change button text to "Submit"', hint: '"change text to Submit"' },
        { text: 'Add a heading', hint: '"add heading"' },
        { text: 'Delete the button (select it first)', hint: '"select button", then "delete element"' },
      ]
    },
    2: {
      desc: 'Compound operations. Each task requires 2–3 commands.',
      tasks: [
        { text: 'Create a blue button with text "Login"', hint: '"add button" → "change color to blue" → "change text to Login"' },
        { text: 'Create a form: add an input field and a "Submit" button', hint: '"add input" → "add button" → "change text to Submit"' },
        { text: 'Add a heading and change its color to green', hint: '"add heading" → "make it green"' },
        { text: 'Undo the last two actions', hint: '"undo" (twice)' },
      ]
    },
    3: {
      desc: 'Free task. Create any interface with 5+ elements using only voice.',
      tasks: [
        { text: 'Build any UI using only voice commands. At least 5 elements.', hint: 'Use any available commands' },
      ]
    }
  }
};

// ==================== NLU PATTERNS ====================
const intentPatterns = {
  ru: [
    {
      intent: 'ADD_ELEMENT',
      patterns: [/добав[ьи]|создай|поставь|вставь/i],
      slots: {
        type: [
          { pattern: /кнопк/i, value: 'button' },
          { pattern: /заголов|хедер|title/i, value: 'heading' },
          { pattern: /пол[е е].*ввод|ввод|инпут|input/i, value: 'input' },
          { pattern: /текст(?!овое)|надпис/i, value: 'text' },
          { pattern: /контейнер|блок|обёртк/i, value: 'container' },
        ]
      }
    },
    {
      intent: 'CHANGE_COLOR',

// ==================== NLU ENGINE ====================
function parseIntent(text) {
  const patterns = intentPatterns[currentLang];
  for (const def of patterns) {
    const matched = def.patterns.some(p => p.test(text));
    if (!matched) continue;

    const slots = {};

    if (def.slots.type) {
      for (const t of def.slots.type) {
        if (t.pattern.test(text)) { slots.type = t.value; break; }
      }
    }
    if (def.slots.color) {
      for (const c of def.slots.color) {
        if (c.pattern.test(text)) { slots.color = c.value; break; }
      }
    }
    if (def.slots.direction) {
      for (const d of def.slots.direction) {
        if (d.pattern.test(text)) { slots.direction = d.value; break; }
      }
    }
    if (def.slots.text === true) {
      const m = text.match(/(?:текст|text|на|to)\s+[«"]?(.+?)[»"]?$/i);
      if (m) slots.text = m[1].trim();
    }

    return { intent: def.intent, slots, confidence: 1 };
  }
  return { intent: 'OUT_OF_DOMAIN', slots: {}, confidence: 0 };
}

// ==================== EDITOR ACTIONS ====================
function executeIntent(parsed, rawText) {
  const { intent, slots } = parsed;
  let result = 'fail';
  let errorType = null;

  saveUndo();

  switch (intent) {
    case 'ADD_ELEMENT': {
      const type = slots.type || 'button';
      addElement(type);
      result = 'success';
      break;
    }
    case 'CHANGE_COLOR': {
      if (!selectedEl) { errorType = 'system'; result = 'fail'; break; }
      if (!slots.color) { errorType = 'nlu'; result = 'fail'; break; }
      applyColor(selectedEl, slots.color);
      result = 'success';
      break;
    }
    case 'CHANGE_TEXT': {
      if (!selectedEl) { errorType = 'system'; result = 'fail'; break; }
      if (!slots.text) { errorType = 'nlu'; result = 'fail'; break; }
      applyText(selectedEl, slots.text);
      result = 'success';
      break;
    }
    case 'CHANGE_SIZE': {
      if (!selectedEl) { errorType = 'system'; result = 'fail'; break; }
      applySize(selectedEl, slots.direction || 'bigger');
      result = 'success';
      break;
    }
    case 'DELETE_ELEMENT': {
      if (!selectedEl) { errorType = 'system'; result = 'fail'; break; }
      deleteElement(selectedEl);
      result = 'success';
      break;
    }
    case 'SELECT_ELEMENT': {
      const found = selectByType(slots.type);
      result = found ? 'success' : 'fail';
      if (!found) errorType = 'system';
      break;
    }
    case 'UNDO': {
      undoAction();
      result = 'success';
      break;
    }
    case 'CLEAR_ALL': {
      clearAll();
      result = 'success';
      break;
    }
    case 'OUT_OF_DOMAIN': {
      result = 'ood';
      errorType = 'out_of_domain';
      break;
    }
  }

  return { result, errorType };
}

let elCounter = 0;
function addElement(type) {
  elCounter++;
  const id = 'el_' + elCounter;
  const elData = { id, type, color: null, text: null, size: 14 };
  elements.push(elData);
  renderElement(elData);
  selectElementById(id);
  updateEmpty();
}

function renderElement(elData) {
  const wrap = document.createElement('div');
  wrap.className = 'canvas-el';
  wrap.id = 'wrap_' + elData.id;
  wrap.onclick = () => selectElementById(elData.id);

  let inner;
  switch (elData.type) {
    case 'button':
      inner = document.createElement('button');
      inner.textContent = elData.text || (currentLang === 'ru' ? 'Кнопка' : 'Button');
      if (elData.color) inner.style.background = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'heading':
      inner = document.createElement('div');
      inner.className = 'el-heading';
      inner.textContent = elData.text || (currentLang === 'ru' ? 'Заголовок' : 'Heading');
      if (elData.color) inner.style.color = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'input':
      inner = document.createElement('input');
      inner.placeholder = elData.text || (currentLang === 'ru' ? 'Введите текст...' : 'Enter text...');
      if (elData.color) inner.style.borderColor = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'text':
      inner = document.createElement('div');
      inner.className = 'el-text';
      inner.textContent = elData.text || (currentLang === 'ru' ? 'Текстовый блок' : 'Text block');
      if (elData.color) inner.style.color = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'container':
      inner = document.createElement('div');
      inner.className = 'el-container';
      inner.textContent = 'Container';
      if (elData.color) inner.style.borderColor = elData.color;
      break;
  }
  wrap.appendChild(inner);
  document.getElementById('canvas-row').appendChild(wrap);
}

function applyColor(elId, color) {
  const elData = elements.find(e => e.id === elId);
  if (!elData) return;
  elData.color = color;
  rerenderElement(elData);
}

function applyText(elId, text) {
  const elData = elements.find(e => e.id === elId);
  if (!elData) return;
  elData.text = text;
  rerenderElement(elData);
}

function applySize(elId, direction) {
  const elData = elements.find(e => e.id === elId);
  if (!elData) return;
  elData.size = direction === 'bigger'
    ? Math.min(elData.size + 3, 36)
    : Math.max(elData.size - 3, 8);
  rerenderElement(elData);
}

function deleteElement(elId) {
  const wrap = document.getElementById('wrap_' + elId);
  if (wrap) wrap.remove();
  elements = elements.filter(e => e.id !== elId);
  if (selectedEl === elId) {
    selectedEl = null;
    document.getElementById('selected-info').textContent = currentLang === 'ru' ? 'Нет выбранного элемента' : 'No element selected';
  }
  updateEmpty();
}

function selectByType(type) {
  if (!type) {
    if (elements.length > 0) {
      selectElementById(elements[elements.length - 1].id);
      return true;
    }
    return false;
  }
  const found = elements.filter(e => e.type === type);
  if (found.length === 0) return false;
  selectElementById(found[found.length - 1].id);
  return true;
}

function selectElementById(id) {
  document.querySelectorAll('.canvas-el').forEach(el => el.classList.remove('selected'));
  selectedEl = id;
  const wrap = document.getElementById('wrap_' + id);
  if (wrap) wrap.classList.add('selected');
  const elData = elements.find(e => e.id === id);
  if (elData) {
    const typeNames = { button: currentLang === 'ru' ? 'Кнопка' : 'Button', heading: currentLang === 'ru' ? 'Заголовок' : 'Heading', input: currentLang === 'ru' ? 'Поле ввода' : 'Input', text: currentLang === 'ru' ? 'Текст' : 'Text', container: 'Container' };
    document.getElementById('selected-info').textContent = '✦ ' + (typeNames[elData.type] || elData.type) + ' #' + id;
  }
}

function rerenderElement(elData) {
  const wrap = document.getElementById('wrap_' + elData.id);
  if (!wrap) return;
  const isSelected = wrap.classList.contains('selected');
  wrap.innerHTML = '';

  let inner;
  switch (elData.type) {
    case 'button':
      inner = document.createElement('button');
      inner.textContent = elData.text || (currentLang === 'ru' ? 'Кнопка' : 'Button');
      if (elData.color) inner.style.background = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'heading':
      inner = document.createElement('div');
      inner.className = 'el-heading';
      inner.textContent = elData.text || (currentLang === 'ru' ? 'Заголовок' : 'Heading');
      if (elData.color) inner.style.color = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'input':
      inner = document.createElement('input');
      inner.placeholder = elData.text || (currentLang === 'ru' ? 'Введите текст...' : 'Enter text...');
      if (elData.color) inner.style.borderColor = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'text':
      inner = document.createElement('div');
      inner.className = 'el-text';
      inner.textContent = elData.text || (currentLang === 'ru' ? 'Текстовый блок' : 'Text block');
      if (elData.color) inner.style.color = elData.color;
      inner.style.fontSize = elData.size + 'px';
      break;
    case 'container':
      inner = document.createElement('div');
      inner.className = 'el-container';
      inner.textContent = 'Container';
      if (elData.color) inner.style.borderColor = elData.color;
      break;
  }
  wrap.appendChild(inner);
  if (isSelected) wrap.classList.add('selected');
}

function undoAction() {
  if (undoStack.length === 0) return;
  const state = undoStack.pop();
  elements = state.elements.map(e => ({ ...e }));
  selectedEl = state.selectedEl;
  document.getElementById('canvas-row').innerHTML = '';
  elements.forEach(e => renderElement(e));
  if (selectedEl) selectElementById(selectedEl);
  updateEmpty();
}

function saveUndo() {
  undoStack.push({ elements: elements.map(e => ({ ...e })), selectedEl });
  if (undoStack.length > 30) undoStack.shift();
}

function clearAll() {
  saveUndo();
  elements = [];
  selectedEl = null;
  document.getElementById('canvas-row').innerHTML = '';
  document.getElementById('selected-info').textContent = currentLang === 'ru' ? 'Нет выбранного элемента' : 'No element selected';
  updateEmpty();
}

function updateEmpty() {
  document.getElementById('ws-empty').style.display = elements.length === 0 ? 'block' : 'none';
}

// ==================== SPEECH RECOGNITION ====================
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Web Speech API не поддерживается. Используйте Chrome.');
    return null;
  }
  const r = new SR();
  r.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
  r.continuous = false;
  r.interimResults = false;

  r.onstart = () => {
    speechStartTime = performance.now();
    setMicState(true);
  };

  r.onresult = (e) => {
    const latency = Math.round(performance.now() - speechStartTime);
    const transcript = e.results[0][0].transcript.trim();
    processTranscript(transcript, latency);
  };

  r.onerror = (e) => {
    setMicState(false);
    if (e.error !== 'no-speech') {
      document.getElementById('transcript-raw').innerHTML = `<span style="color:var(--error)">Ошибка: ${e.error}</span>`;
    }
  };

  r.onend = () => {
    setMicState(false);
  };

  return r;
}

function toggleMic() {
  if (isRecording) {
    recognition && recognition.stop();
    return;
  }
  recognition = initRecognition();
  if (!recognition) return;
  recognition.start();
}

function setMicState(recording) {
  isRecording = recording;
  const btn = document.getElementById('mic-btn');
  const dot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  btn.classList.toggle('recording', recording);
  btn.textContent = recording ? '⏹' : '🎙';
  dot.className = 'status-dot ' + (recording ? 'recording' : 'ready');
  statusText.textContent = recording ? (currentLang === 'ru' ? 'Запись...' : 'Recording...') : (currentLang === 'ru' ? 'Готово' : 'Ready');
}

function processTranscript(transcript, latency) {
  taskAttempts++;
  const parsed = parseIntent(transcript);
  const { result, errorType } = executeIntent(parsed, transcript);

  // WER calculation (simplified: compare to closest task hint)
  const wer = estimateWER(transcript);

  // Log entry
  const entry = {
    timestamp: new Date().toISOString(),
    lang: currentLang,
    scenario: currentScenario,
    taskIdx: currentTaskIdx,
    taskAttempt: taskAttempts,
    rawTranscript: transcript,
    detectedIntent: parsed.intent,
    extractedSlots: parsed.slots,
    confidence: parsed.confidence,
    actionResult: result,
    errorType: errorType || null,
    latencyMs: latency,
    wer: wer,
  };

  if (taskAttempts === 1 && result === 'success') {
    firstAttemptSuccess = true;
    entry.firstAttemptSuccess = true;
  }

  sessionLog.push(entry);
  updateStats();
  addLogEntry(entry);
  showIntentDisplay(transcript, parsed, result, latency);
}

function estimateWER(transcript) {
  // simplified: returns 0 if we got a valid intent, estimate based on length otherwise
  return 0;
}

function showIntentDisplay(transcript, parsed, result, latency) {
  document.getElementById('transcript-raw').innerHTML = `<span>${transcript}</span> <span style="color:var(--text-dim);font-size:10px">${latency}ms</span>`;

  const id = document.getElementById('intent-display');
  if (parsed.intent === 'OUT_OF_DOMAIN') {
    id.innerHTML = `<span class="result-tag ood">Out-of-domain</span>`;
    return;
  }

  let html = `<span class="intent-tag">${parsed.intent}</span>`;
  for (const [k, v] of Object.entries(parsed.slots)) {
    html += `<span class="slot-tag">${k}: ${v}</span>`;
  }
  html += `<span class="result-tag ${result}">${result === 'success' ? '✓ OK' : result === 'ood' ? 'OOD' : '✗ FAIL'}</span>`;
  id.innerHTML = html;
}

// ==================== STATS ====================
function updateStats() {
  const total = sessionLog.length;
  const successes = sessionLog.filter(e => e.actionResult === 'success').length;
  const oods = sessionLog.filter(e => e.actionResult === 'ood').length;
  const firstAttempts = sessionLog.filter(e => e.firstAttemptSuccess).length;
  const tasks = sessionLog.filter(e => e.taskAttempt === 1).length || 1;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-success').textContent = total ? Math.round(successes / total * 100) + '%' : '0%';
  document.getElementById('stat-fasr').textContent = tasks ? Math.round(firstAttempts / tasks * 100) + '%' : '0%';
  document.getElementById('stat-ood').textContent = total ? Math.round(oods / total * 100) + '%' : '0%';
}

function addLogEntry(entry) {
  const container = document.getElementById('log-entries');
  if (container.children.length === 1 && container.children[0].style.textAlign === 'center') {
    container.innerHTML = '';
  }
  const div = document.createElement('div');
  div.className = 'log-entry ' + entry.actionResult;
  div.innerHTML = `
    <div class="log-time">${new Date(entry.timestamp).toLocaleTimeString()} · ${entry.latencyMs}ms · С${entry.scenario}T${entry.taskIdx + 1}</div>
    <div class="log-cmd">"${entry.rawTranscript}"</div>
    <div class="log-meta">${entry.detectedIntent} · ${entry.actionResult}${entry.errorType ? ' · ' + entry.errorType : ''}</div>
  `;
  container.insertBefore(div, container.firstChild);
}

// ==================== SCENARIO UI ====================
function switchScenario(n) {
  currentScenario = n;
  currentTaskIdx = 0;
  document.querySelectorAll('.sc-tab').forEach((t, i) => t.classList.toggle('active', i === n - 1));
  renderTaskList();
  resetTaskTimer();
}

function renderTaskList() {
  const sc = scenarios[currentLang][currentScenario];
  document.getElementById('scenario-desc').textContent = sc.desc;
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  sc.tasks.forEach((task, idx) => {
    const div = document.createElement('div');
    div.className = 'task-item' + (idx === currentTaskIdx ? ' active' : '');
    div.id = 'task_' + idx;
    div.onclick = () => setCurrentTask(idx);
    div.innerHTML = `
      <div class="task-num">Задание ${idx + 1}</div>
      <div class="task-text">${task.text}</div>
      <div class="task-hint">${task.hint}</div>
    `;
    list.appendChild(div);
  });
}

function setCurrentTask(idx) {
  currentTaskIdx = idx;
  taskAttempts = 0;
  firstAttemptSuccess = false;
  document.querySelectorAll('.task-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  resetTaskTimer();
}

function startCurrentTask() {
  taskAttempts = 0;
  firstAttemptSuccess = false;
  taskStartTime = Date.now();
  clearInterval(taskTimerInterval);
  taskTimerInterval = setInterval(updateTimer, 500);
  document.getElementById('start-task-btn').textContent = '■ Стоп';
  document.getElementById('start-task-btn').onclick = stopCurrentTask;
  document.getElementById('session-info').textContent = `С${currentScenario} · Задание ${currentTaskIdx + 1}`;
}

function stopCurrentTask() {
  clearInterval(taskTimerInterval);
  document.getElementById('start-task-btn').textContent = '▶ Старт';
  document.getElementById('start-task-btn').onclick = startCurrentTask;
}

function markTaskDone() {
  stopCurrentTask();
  const taskEl = document.getElementById('task_' + currentTaskIdx);
  if (taskEl) taskEl.classList.add('done');

  const elapsed = taskStartTime ? Math.round((Date.now() - taskStartTime) / 1000) : 0;
  document.getElementById('finish-stats').textContent =
    `Время: ${elapsed}с · Попыток: ${taskAttempts} · ${firstAttemptSuccess ? '✓ Первая попытка успешна' : '— Потребовались повторы'}`;
  document.getElementById('finish-overlay').classList.add('show');

  // Move to next task
  const sc = scenarios[currentLang][currentScenario];
  if (currentTaskIdx < sc.tasks.length - 1) {
    currentTaskIdx++;
  }
}

function closeFinish() {
  document.getElementById('finish-overlay').classList.remove('show');
  setCurrentTask(currentTaskIdx);
}

function updateTimer() {
  if (!taskStartTime) return;
  const elapsed = Math.floor((Date.now() - taskStartTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  const display = document.getElementById('task-timer');
  display.textContent = `${m}:${s}`;
  display.className = 'timer-display' + (elapsed > 120 ? ' warn' : '');
}

function resetTaskTimer() {
  clearInterval(taskTimerInterval);
  taskStartTime = null;
  document.getElementById('task-timer').textContent = '00:00';
  document.getElementById('start-task-btn').textContent = '▶ Старт';
  document.getElementById('start-task-btn').onclick = startCurrentTask;
}

    meta: {
      exportedAt: new Date().toISOString(),
      lang: currentLang,
      totalCommands: sessionLog.length,
      tsr: sessionLog.length ? Math.round(sessionLog.filter(e => e.actionResult === 'success').length / sessionLog.length * 100) : 0,
    },
    log: sessionLog
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `voicelab_log_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
  a.click();
}

function clearLog() {
  if (!confirm('Очистить лог сессии?')) return;
  sessionLog = [];
  document.getElementById('log-entries').innerHTML = '<div style="color:var(--text-dim);font-size:11px;padding:8px;text-align:center">Лог пуст</div>';
  updateStats();
}

// ==================== LANG SWITCH ====================
function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  renderTaskList();
  document.getElementById('transcript-raw').textContent = lang === 'ru'
    ? 'Нажмите 🎙 или Space для голосового ввода'
    : 'Press 🎙 or Space to start voice input';
  document.getElementById('ws-empty').querySelector('span:last-child').textContent =
    lang === 'ru' ? '«добавь кнопку» / «add button»' : '"add button" / "добавь кнопку"';
}

// ==================== KEYBOARD SHORTCUT ====================
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    toggleMic();
  }
});

// ==================== INIT ====================
renderTaskList();
updateEmpty();
</script>
</body>
</html>
